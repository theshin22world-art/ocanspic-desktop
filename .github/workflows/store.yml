name: Build for Microsoft Store (appx)
on:
  workflow_dispatch:      # Actions 탭 → Run workflow. 결과는 Artifacts 의 OCansPic-store-appx.zip

jobs:
  appx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Find app folder
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT";
          elif [ -f ocanspic-desktop/package.json ]; then echo "dir=ocanspic-desktop" >> "$GITHUB_OUTPUT";
          else echo "package.json 을 찾을 수 없습니다"; exit 1; fi
      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        working-directory: ${{ steps.app.outputs.dir }}
      - name: Check store identity
        shell: bash
        run: |
          node -e "const a=require('./package.json').build.appx; if(!a||/REPLACE/.test(a.identityName+a.publisher)){console.error('::error::package.json build.appx 의 identityName/publisher 를 파트너 센터 값으로 바꿔 주세요'); process.exit(1)} console.log('identity', a.identityName, a.publisher)"
          test -f build/appx/StoreLogo.png || { echo "::error::build/appx 아이콘이 없습니다"; exit 1; }
        working-directory: ${{ steps.app.outputs.dir }}
      - run: node sync.js
        working-directory: ${{ steps.app.outputs.dir }}
      - name: Build appx (unsigned — Store signs it)
        run: npx electron-builder --win appx --publish never
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: OCansPic-store-appx
          path: ${{ steps.app.outputs.dir }}/release/*.appx
          if-no-files-found: error
