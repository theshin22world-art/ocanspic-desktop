name: Build & Release
on:
  push:
    tags: ['v*']          # 예: git tag v1.0.0 && git push --tags
  workflow_dispatch:      # Actions 탭 → Run workflow 버튼으로도 실행

permissions:
  contents: write         # 릴리스 생성·파일 업로드에 필요

jobs:
  build:
    strategy:
      fail-fast: false          # mac 이 실패해도 windows 는 계속
      matrix:
        include:
          - os: windows-latest
            cmd: npx electron-builder --win --publish always
          - os: macos-latest
            cmd: npx electron-builder --mac --publish always
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}   # Apple 인증서가 아직 없으면 mac 만 실패로 두고 릴리스는 진행
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # package.json 이 저장소 루트에 있든 ocanspic-desktop/ 하위 폴더에 있든 찾아서 그 안에서 빌드
      - name: Find app folder
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then echo "dir=." >> "$GITHUB_OUTPUT";
          elif [ -f ocanspic-desktop/package.json ]; then echo "dir=ocanspic-desktop" >> "$GITHUB_OUTPUT";
          else echo "package.json 을 찾을 수 없습니다"; exit 1; fi

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        working-directory: ${{ steps.app.outputs.dir }}
      - name: Check files
        shell: bash
        run: |
          ls -la
          test -f renderer/index.html || { echo "::error::renderer/index.html 이 없습니다 — zip 의 renderer 폴더를 올려 주세요"; exit 1; }
          test -f renderer/native-bridge.js || { echo "::error::renderer/native-bridge.js 가 없습니다"; exit 1; }
          test -f build/icon.png || { echo "::error::build/icon.png 이 없습니다"; exit 1; }
        working-directory: ${{ steps.app.outputs.dir }}
      - run: node sync.js
        working-directory: ${{ steps.app.outputs.dir }}
      - name: Build & publish
        run: ${{ matrix.cmd }}
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 인증서 시크릿이 비어 있으면 electron-builder 가 서명·공증을 건너뛰도록
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          # macOS 서명·공증 (Apple Developer 계정) — 승인 후 Settings → Secrets 에 추가
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
